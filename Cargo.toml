[package]
name = "desmack"
version = "0.2.0"
description = "Extracts the assets of a SMK ROM (SNES)"
authors = ["Jan T. Sott"]
repository = "https://github.com/idleberg/desmack"
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "README.md"
keywords = ["snes", "super-mario-kart", "rom", "extractor"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4"
clark = "0.2"
crc32fast = "1"
png = "0.17"

[profile.release]
lto = true
strip = true
